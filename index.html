<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff3fa">
  <title>アイカツアンコール カード手帳</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top"><div class="brand-mark">✦</div><div><p class="eyebrow">MY COLLECTION</p><h1>アイカツアンコール</h1></div><span class="ribbon">♡</span></header>
  <main>
    <section id="loginPanel" class="panel login-panel"><div class="sparkle">✧ ✦ ✧</div><h2>わたしのカード図鑑</h2><p>Googleログインして、カードの所持状況を保存しよう。</p><button id="loginBtn" class="primary">Googleでログイン</button><p id="authMessage" class="hint">ログインすると、別の端末でもデータを引き継げるよ。</p></section>
    <section id="appPanel" hidden>
      <section class="summary-grid"><article class="summary"><span>登録カード</span><strong id="totalCount">0</strong></article><article class="summary"><span>所持カード</span><strong id="ownedCount">0</strong></article><article class="summary"><span>欲しいカード</span><strong id="wantedCount">0</strong></article></section>
      <section class="panel"><div class="section-heading"><h2>カードを探す</h2><span>✧</span></div><input id="searchInput" type="search" placeholder="カード名・番号・シリーズで検索"><div class="filters"><select id="groupFilter" aria-label="カードの種類"><option value="all">すべてのカード</option><option value="通常カード">1弾・通常</option><option value="パラレルカード">1弾・パラレル</option><option value="プロモーションカード">プロモーション</option><option value="手動登録">手動登録</option></select><select id="statusFilter" aria-label="所持状況"><option value="all">すべて</option><option value="owned">所持</option><option value="notOwned">未所持</option><option value="exchange">交換予定</option><option value="wanted">欲しい</option></select><button id="addBtn" class="secondary">＋ カード追加</button></div><p class="hint">カード情報130種類を自動登録するよ。画像はカードごとに後から追加できるよ。</p></section>
      <section id="cardList" class="card-list"></section><div class="account-row"><span id="userLabel"></span><button id="logoutBtn" class="text-button">ログアウト</button></div>
    </section>
  </main>
  <dialog id="cardDialog"><form id="cardForm" method="dialog"><div class="section-heading"><h2 id="dialogTitle">カードを追加</h2><button type="button" id="closeDialog" class="text-button">閉じる</button></div><input type="hidden" id="cardId">
    <label>カード番号<input id="cardNumber" maxlength="40" placeholder="例：E1-01_PR"></label><label>カード名<input id="cardName" required maxlength="100" placeholder="例：カード名"></label><label>シリーズ・弾<input id="cardSeries" maxlength="100" placeholder="例：第1弾"></label><label>レアリティ<input id="cardRarity" maxlength="40" placeholder="例：PR"></label>
    <label class="image-picker">カード表面画像<input id="cardImage" type="file" accept="image/*"><span class="hint">写真アプリから画像を選べるよ。画像はカード情報と同じデータに保存されるよ。</span></label>
    <div id="imagePreviewWrap" class="image-preview-wrap" hidden><img id="imagePreview" alt="カード画像プレビュー"><button type="button" id="removeImageBtn" class="text-button">画像を外す</button></div>
    <label>メモ<input id="cardMemo" maxlength="300" placeholder="任意"></label><label class="check"><input id="isOwned" type="checkbox"> 所持している</label><label class="check"><input id="isExchange" type="checkbox"> 交換予定</label><label class="check"><input id="isWanted" type="checkbox"> 欲しいカード</label><label>所持枚数<input id="quantity" type="number" min="0" max="999" value="0"></label>
    <div class="dialog-actions"><button type="button" id="deleteBtn" class="danger" hidden>削除</button><button type="submit" class="primary">保存する</button></div><p id="formMessage" class="hint"></p>
  </form></dialog>
  <dialog id="imageDialog" class="image-dialog"><button type="button" id="closeImageDialog" class="text-button image-close">閉じる</button><img id="largeCardImage" alt="カード画像拡大"></dialog>
  <footer>♡ MY AIKATSU CARD NOTE ♡</footer><script type="module" src="app.js"></script>
</body>
</html>
